plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.clipper.core'
    compileSdk 36

    defaultConfig {
        applicationId 'com.clipper.core'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.13"
        pip {
            install "requests"
        }
    }
}
